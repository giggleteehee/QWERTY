<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    html, body { background: transparent; margin: 0; padding: 0; font-family: sans-serif; }
    #overlay-container { width: 960px; height: 540px; position: relative; }
    #input-box-container {
      display: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border: 2px solid black;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    #skip {
      display: none; position: absolute; bottom: 60px; right: 0; padding: 10px 18px;
      background: rgba(0, 0, 0, 0.6); border: 1px solid black; border-right-width: 0;
      font-size: 1.2rem; border-radius: 4px 0 0 4px; color: white; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <div id="input-box-container">
      <h1>UNSKIPPABLE AD</h1>
      <p>Please type "skip ad" and press Enter to continue.</p>
      <input type="text" id="ad-input" autocomplete="off" placeholder="Type here...">
      <div id="feedback" style="color: red; margin-top: 10px;"></div>
    </div>
    <button id="skip" type="button">Skip Ad...</button>
  </div>

  <script type="text/javascript">
    (function(window, document){
      function adSuccess() {
        window.top.postMessage({ type: 'success' }, '*');
      }

      // This is the specific command to restart just the ad
      function adRestart() {
        window.top.postMessage({ type: 'fail' }, '*');
      }

      const skipButton = document.getElementById('skip');
      const inputArea = document.getElementById('input-box-container');
      const box = document.getElementById('ad-input');
      const feedback = document.getElementById('feedback');

      window.addEventListener('message', (event) => {
        if (!event.data || !event.data.type) return;

        if (event.data.type === 'adStarted') {
          skipButton.style.display = 'block';
        }

        // TEMPLATE FIX: This was causing the reload/reset behavior
        if (event.data.type === 'adFinished') {
          skipButton.style.display = 'none';
          adRestart(); // Restarts the video without reloading the page
        }
      });

      skipButton.addEventListener('click', () => {
        skipButton.style.display = 'none';
        inputArea.style.display = 'block';
        box.focus();
      });

      const keyboardMap = {
        'a' : 'o', 'b' : 'q', 'c' : 'p', 'd' : 'm', 'e' : 'z',
        'f' : 'l', 'g' : 'w', 'h' : 'v', 'i' : 'u', 'j' : 'n',
        'k' : 'o', 'l' : 't', 'm' : 'k', 'n' : 'j', 'o' : 'g',
        'p' : 'r', 'q' : 'f', 'r' : 'h', 's' : 'y', 't' : 'b',
        'u' : 'i', 'v' : 'e', 'w' : 'c', 'x' : 'd', 'y' : 's',
        'z' : 'a', ' ' : ' m'
      };

      box.addEventListener('keydown', function (event) {
        let real_key = event.key.toLowerCase();
        feedback.innerText = "";

        if (keyboardMap.hasOwnProperty(real_key)) {
          event.preventDefault();
          box.value += keyboardMap[real_key];
        }

        if (event.key === "Enter") {
          event.preventDefault();
          if (box.value === "skip ad") {
            adSuccess();
          } else if (box.value === "your mom") {
            feedback.innerText = "What about my mom?";
          } else {
            feedback.innerText = "Incorrect! Restarting ad...";
            setTimeout(adRestart, 1200); // Restarts the ad loop
          }
        }
      });
    })(window, document);
  </script>
</body>
</html>
