<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ad Interaction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #overlay-container {
      width: 960px;
      height: 540px;
      position: relative;
      overflow: hidden;
    }
    #input-box-container {
      display: none;
      text-align: center;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      border: 1px solid #e0e0e0;
    }
    h2 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px 0; color: #202124; }
    p { font-size: 0.9rem; color: #5f6368; margin: 0 0 24px 0; line-height: 1.4; }
    .password-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    #ad-input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }
    #ad-input:focus { border-color: #1a73e8; }
    #toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    #skip {
      display: none;
      position: absolute;
      bottom: 60px;
      right: 0;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-right: none;
      font-size: 1rem;
      color: white;
      cursor: pointer;
    }
    #feedback { font-size: 0.8rem; height: 20px; margin-top: 12px; }
  </style>
</head>
<body>

<div id="overlay-container">
  <button id="skip">Skip Ad &rsaquo;</button>

  <div id="input-box-container">
    <h2>Are you sure you meant to skip this ad?</h2>
    <p>If so, please type <strong>skip ad</strong> to continue.</p>

    <div class="password-wrapper">
      <input type="password" id="ad-input" autocomplete="off" placeholder="Enter phrase">
      <div id="toggle-password">
        <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#5f6368" stroke-width="1.5" fill="none"></path>
          <circle cx="12" cy="12" r="3" stroke="#5f6368" stroke-width="1.5" fill="none"></circle>
        </svg>
      </div>
    </div>

    <div id="feedback" style="color: #d93025;"></div>
  </div>
</div>

<script type="text/javascript">
  (function(window, document){
    const skipButton = document.getElementById('skip');
    const inputArea = document.getElementById('input-box-container');
    const box = document.getElementById('ad-input');
    const feedback = document.getElementById('feedback');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', () => {
      const isPass = box.type === 'password';
      box.type = isPass ? 'text' : 'password';
      eyeIcon.innerHTML = isPass
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="#1a73e8" stroke-width="1.5" fill="none"></path><line x1="1" y1="1" x2="23" y2="23" stroke="#1a73e8" stroke-width="1.5"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#5f6368" stroke-width="1.5" fill="none"></path><circle cx="12" cy="12" r="3" stroke="#5f6368" stroke-width="1.5" fill="none"></circle>';
    });

    window.addEventListener('message', (e) => {
      if (e.data.type === 'adStarted' && inputArea.style.display !== 'block') skipButton.style.display = 'block';
      if (e.data.type === 'adFinished') window.top.postMessage({ type: 'fail' }, '*');
    });

    skipButton.addEventListener('click', () => {
      skipButton.style.display = 'none';
      inputArea.style.display = 'block';
      box.focus();
    });

    const keyboardMap = {
      'a' : 'o', 'b' : 'q', 'c' : 'p', 'd' : 'm', 'e' : 'z',
      'f' : 'l', 'g' : 'w', 'h' : 'v', 'i' : 'u', 'j' : 'n',
      'k' : 'o', 'l' : 't', 'm' : 'k', 'n' : 'j', 'o' : 'g',
      'p' : 'r', 'q' : 'f', 'r' : 'h', 's' : 'y', 't' : 'b',
      'u' : 'i', 'v' : 'e', 'w' : 'a', 'x' : 'c', 'y' : 's',
      'z' : 'd', ' ' : ' m', ',' : 'z'
    };

    box.addEventListener('keydown', (e) => {
      feedback.innerText = "";
      if (e.key === 'Backspace') return;
      const key = e.key.toLowerCase();
      if (keyboardMap.hasOwnProperty(key)) {
        e.preventDefault();
        box.value += keyboardMap[key];
      }
      if (e.key === "Enter") {
        e.preventDefault();
        if (box.value === "skip ad") window.top.postMessage({ type: 'success' }, '*');
        else {
          feedback.innerText = "Incorrect, please try again.";
          window.top.postMessage({ type: 'fail' }, '*');
        }
      }
    });
  })(window, document);
</script>
</body>
</html>
