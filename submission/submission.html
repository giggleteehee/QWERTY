<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style type="text/css">
    html,
    body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #overlay-container {
      width: 960px;
      height: 540px;
    }

    /* 1. HIDE YOUR TROLL BOX BY DEFAULT */
    #troll-container {
      display: none;
      text-align: center;
    }

    #skip {
      display: none;
      position: absolute;
      bottom: 60px;
      right: 0;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid black;
      border-right-width: 0;
      font-size: 1.2rem;
      border-radius: 4px 0 0 4px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="overlay-container">
    <div id="troll-container">
      <p>Please type "skip ad" and press Enter to continue.</p>
      <input type="text" id="input" autocomplete="off" placeholder="Type here...">
    </div>

    <button id="skip" type="button">
      Skip Ad...
    </button>
  </div>

  <script type="text/javascript">
    (function(window, document){
      function adSuccess() {
        window.top.postMessage({ type: 'success' }, '*');
      }

      const skipButton = document.getElementById('skip');
      const trollContainer = document.getElementById('troll-container'); // Added this to find your box
      const box = document.getElementById('input');

      window.addEventListener('message', (event) => {
        if (!event.data || !event.data.type) return;

        if (event.data.type === 'adStarted') {
          skipButton.style.display = 'block';
        }

        if (event.data.type === 'adFinished') {
          skipButton.style.display = 'none';
          window.top.postMessage({ type: 'fail' }, '*');
        }
      });
      skipButton.addEventListener('click', () => {
        skipButton.style.display = 'none';
        trollContainer.style.display = 'block'; // Make your box appear
        box.focus(); // Put the cursor in the box automatically
      });

      const keyboard = {
        'a' : 'o',
        'b' : 'skip ad',
        'c' : 'x',
        'd' : 'm',
        'e' : 'x',
        'f' : 'x',
        'g' : 'x',
        'h' : 'x',
        'i' : 'u',
        'j' : 'x',
        'k' : 'o',
        'l' : 'x',
        'm' : 'x',
        'n' : 'x',
        'o' : 'x',
        'p' : 'r',
        'q' : 'x',
        'r' : 'x',
        's' : 'y',
        't' : 'x',
        'u' : 'x',
        'v' : 'x',
        'w' : 'x',
        'x' : 'x',
        'y' : 'x',
        'z' : 'x',
        ' ' : ' m',
      };

      box.addEventListener('keydown', function (event) {
        let real_key = event.key.toLowerCase();
        if (keyboard.hasOwnProperty(real_key)) {
          event.preventDefault();
          box.value += keyboard[real_key]
        }
        if (event.key === "Enter") {
            if (box.value === "skip ad") {
                adSuccess()
            }
            if (box.value === "your mom") {
                alert("No, it's your mom, not mine.");
            } else {
                alert("ERROR: You must type 'skip ad' correctly!");
            }
        }
      });

    })(window, document);
  </script>
</body>
</html>
