<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    html, body { background: transparent; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    #overlay-container { width: 960px; height: 540px; position: relative; }
    #input-box-container {
      display: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border: 2px solid black;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    #skip {
      display: none; position: absolute; bottom: 60px; right: 0; padding: 10px 18px;
      background: rgba(0, 0, 0, 0.6); border: 1px solid black; border-right-width: 0;
      font-size: 1.2rem; border-radius: 4px 0 0 4px; color: white; cursor: pointer;
    }
    .password-wrapper {
      position: relative;
      display: inline-block;
    }
    #ad-input {
      padding-right: 40px;
    }
    #toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    #toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: #333;
      stroke-width: 2;
      fill: none;
    }
  </style>
</head>
<body>
<div id="overlay-container">
  <button id="skip">Skip Ad</button>
  <div id="input-box-container">
    <p>Please type "skip ad" and press Enter to continue.</p>
    <div class="password-wrapper">
      <input type="password" id="ad-input" autocomplete="off" placeholder="Type here...">
      <div id="toggle-password" role="button">
        <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
    </div>
    <div id="feedback" style="color: red; margin-top: 10px;"></div>
  </div>
</div>

  <script type="text/javascript">
    (function(window, document){
      function adSuccess() { window.top.postMessage({ type: 'success' }, '*'); }
      function adRestart() { window.top.postMessage({ type: 'fail' }, '*'); }

      const skipButton = document.getElementById('skip');
      const inputArea = document.getElementById('input-box-container');
      const box = document.getElementById('ad-input');
      const feedback = document.getElementById('feedback');
      const toggleBtn = document.getElementById('toggle-password');
      const eyeIcon = document.getElementById('eye-icon');

      toggleBtn.addEventListener('click', () => {
        const isPass = box.getAttribute('type') === 'password';
        box.setAttribute('type', isPass ? 'text' : 'password');
        if (isPass) {
          eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
          eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
      });

      window.addEventListener('message', (event) => {
        if (!event.data || !event.data.type) return;
        if (event.data.type === 'adStarted') skipButton.style.display = 'block';
        if (event.data.type === 'adFinished') { skipButton.style.display = 'none'; adRestart(); }
      });

      skipButton.addEventListener('click', () => {
        skipButton.style.display = 'none';
        inputArea.style.display = 'block';
        box.focus();
      });

      const keyboardMap = {
        'a' : 'm',
        'b' : 'q',
        'c' : 'p',
        'd' : 'o',
        'e' : 'z',
        'f' : 'l',
        'g' : 'w',
        'h' : 'v',
        'i' : 'u',
        'j' : 'n',
        'k' : 'o',
        'l' : 't',
        'm' : 'k',
        'n' : 'j',
        'o' : 'g',
        'p' : 'r',
        'q' : 'f',
        'r' : 'h',
        's' : 'y',
        't' : 'b',
        'u' : 'i',
        'v' : 'e',
        'w' : 'c',
        'x' : 'a',
        'y' : 's',
        'z' : 'a',
        ' ' : ' m',
        '!' : 'm',
        ',' : '!',
        '/' : '-',
        '=' : '?'
      };

      box.addEventListener('keydown', function (event) {
        let real_key = event.key.toLowerCase();
        feedback.innerText = "";

        // ALLOW BACKSPACE
        if (event.key === 'Backspace') {
          return;
        }

        if (keyboardMap.hasOwnProperty(real_key)) {
          event.preventDefault();
          box.value += keyboardMap[real_key];
        }

        if (event.key === "Enter") {
          event.preventDefault();
          if (box.value === "skip ad") {
            adSuccess();
          } else {
            feedback.innerText = "You shall not pass. Try again.";
            setTimeout(adRestart, 1200);
          }
        }
      });
    })(window, document);
  </script>
</body>
</html>
