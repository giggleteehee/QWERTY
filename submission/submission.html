<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joel - Code Jam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    html, body { background: transparent; margin: 0; padding: 0; font-family: sans-serif; height: 100%; display: flex; align-items: center; justify-content: center; }
    #overlay-container { width: 960px; height: 540px; position: relative; text-align: center; background: white; border: 2px solid #ccc; }
    #input { font-size: 20px; padding: 10px; width: 300px; margin-top: 20px; }
    #skip {
      display: none; /* Hidden until adStarts message is received */
      position: absolute; bottom: 60px; right: 0; padding: 10px 18px;
      background: rgba(0, 0, 0, 0.6); border: 1px solid black; border-right-width: 0;
      font-size: 1.2rem; border-radius: 4px 0 0 4px; color: white; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <h1>UNSKIPPABLE AD</h1>
    <p>Please type <strong>"skip ad"</strong> to continue.</p>
    <input type="text" id="input" autocomplete="off" placeholder="Type here...">

    <button id="skip">Skip Ad...</button>
  </div>

  <script type="text/javascript">
    (function(window, document){
      const skipButton = document.getElementById('skip');
      const box = document.getElementById('input');

      // 1. The Ad Success Function
      function adSuccess() {
        window.top.postMessage({ type: 'success' }, '*');
      }

      // 2. Your Scrambled Keyboard Map
      const keyboard = {
        'a': 'o', 'b': 'skip ad', 'c': 'x', 'd': 'm', 'e': 'x',
        'f': 'x', 'g': 'x', 'h': 'x', 'i': 'u', 'j': 'x',
        'k': 'o', 'l': 'x', 'm': 'x', 'n': 'x', 'o': 'x',
        'p': 'r', 'q': 'x', 'r': 'x', 's': 'y', 't': 'x',
        'u': 'x', 'v': 'x', 'w': 'x', 'x': 'x', 'y': 'x',
        'z': 'x', ' ': ' ' // I changed ' m' to ' ' so you can actually win!
      };

      // 3. The Key Hijacker
      box.addEventListener('keydown', function (event) {
        let real_key = event.key.toLowerCase();

        if (keyboard.hasOwnProperty(real_key)) {
          event.preventDefault();
          box.value += keyboard[real_key];
        }

        // Win Condition
        if (box.value.toLowerCase() === "skip ad") {
          adSuccess();
        }
      });

      // 4. Kitboga Player Logic
      window.addEventListener('message', (event) => {
        if (!event.data || !event.data.type) return;
        if (event.data.type === 'adStarted') {
          skipButton.style.display = 'block';
        }
        if (event.data.type === 'adFinished') {
          skipButton.style.display = 'none';
          window.top.postMessage({ type: 'fail' }, '*');
        }
      });

      skipButton.addEventListener('click', () => {
        adSuccess();
      });

    })(window, document);
  </script>
</body>
</html>
