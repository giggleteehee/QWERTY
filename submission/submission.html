<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    html, body { background: transparent; margin: 0; padding: 0; font-family: sans-serif; }

    /* Ensure the container covers the game area */
    #overlay-container {
      width: 960px;
      height: 540px;
      position: relative;
      overflow: hidden;
    }

    #input-box-container {
      display: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border: 2px solid black;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 10; /* Make sure it stays on top */
    }

    /* Fixed Skip Button positioning */
    #skip {
      display: none;
      position: absolute;
      bottom: 60px;
      right: 0;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid black;
      border-right-width: 0;
      font-size: 1.2rem;
      border-radius: 4px 0 0 4px;
      color: white;
      cursor: pointer;
      z-index: 5;
    }

    .password-wrapper {
      position: relative;
      display: inline-block;
    }

    #ad-input {
      padding-right: 40px;
    }

    #toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<div id="overlay-container">
  <button id="skip">Skip Ad</button>

  <div id="input-box-container">
    <p>Please type "skip ad" and press Enter to continue.</p>

    <div class="password-wrapper">
      <input type="password" id="ad-input" autocomplete="off" placeholder="Type here...">
      <span id="toggle-password" role="button">👁️</span>
    </div>

    <div id="feedback" style="color: red; margin-top: 10px;"></div>
  </div>
</div>

<script type="text/javascript">
  (function(window, document){
    function adSuccess() {
      window.top.postMessage({ type: 'success' }, '*');
    }

    function adRestart() {
      window.top.postMessage({ type: 'fail' }, '*');
    }

    const skipButton = document.getElementById('skip');
    const inputArea = document.getElementById('input-box-container');
    const box = document.getElementById('ad-input');
    const feedback = document.getElementById('feedback');
    const toggleBtn = document.getElementById('toggle-password');

    // Toggle logic
    toggleBtn.addEventListener('click', () => {
      const type = box.getAttribute('type') === 'password' ? 'text' : 'password';
      box.setAttribute('type', type);
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    window.addEventListener('message', (event) => {
      if (!event.data || !event.data.type) return;

      if (event.data.type === 'adStarted') {
        skipButton.style.display = 'block';
      }

      if (event.data.type === 'adFinished') {
        skipButton.style.display = 'none';
        adRestart();
      }
    });

    skipButton.addEventListener('click', () => {
      skipButton.style.display = 'none';
      inputArea.style.display = 'block';
      box.focus();
    });

    const keyboardMap = {
      'a' : 'm', 'b' : 'q', 'c' : 'p', 'd' : 'o', 'e' : 'z',
      'f' : 'l', 'g' : 'w', 'h' : 'v', 'i' : 'u', 'j' : 'n',
      'k' : 'o', 'l' : 't', 'm' : 'k', 'n' : 'j', 'o' : 'g',
      'p' : 'r', 'q' : 'f', 'r' : 'h', 's' : 'y', 't' : 'b',
      'u' : 'i', 'v' : 'e', 'w' : 'c', 'x' : 'a', 'y' : 's',
      'z' : 'a', ' ' : ' ', '!' : 'm', ',' : '!', '/' : '-', '=' : '?'
    };

    box.addEventListener('keydown', function (event) {
      let real_key = event.key.toLowerCase();
      feedback.innerText = "";

      if (keyboardMap.hasOwnProperty(real_key)) {
        event.preventDefault();
        box.value += keyboardMap[real_key];
      }

      if (event.key === "Enter") {
        event.preventDefault();
        if (box.value === "skip ad") {
          adSuccess();
        } else {
          feedback.innerText = "You shall not pass. Try again.";
          setTimeout(adRestart, 1200);
        }
      }
    });
  })(window, document);
</script>
</body>
</html>
